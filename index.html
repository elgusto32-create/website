<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}
.container{
padding:30px;
}
h1{
font-size:3em;
margin-bottom:10px;
}
p{
font-size:1.2em;
color:#ccc;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#00b894;
color:white;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#019875;
}
</style>
</head>
<body>

<div class="container">
<h1>Welcome to My Website</h1>
<p>This website is hosted for free using GitHub Pages.</p>
<button onclick="alert('Thanks for visiting!')">Click Me</button>
</div>

</body>
</html>
